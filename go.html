<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Meta básica -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <title>BFTech - Redireccionando...</title>
    <meta name="description" content="Redireccionándote a BFTech" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/img/logoBFT-favicon.png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/assets/img/logoBFT-favicon.png" sizes="180x180" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="/styles/styles.css" />

    <style>
        .redirect-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            gap: 40px;
        }

        .redirect-logo {
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .redirect-logo img {
            width: 150px;
            height: auto;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .redirect-content h1 {
            font-family: "GothamBold", sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ffc419, #d3a707);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .redirect-content p {
            font-family: "Inter", sans-serif;
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }

        .loader span {
            width: 12px;
            height: 12px;
            background: linear-gradient(90deg, #ffc419, #d3a707);
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        .loader span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loader span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .redirect-message {
            font-family: "Inter", sans-serif;
            font-size: 0.95rem;
            color: #999999;
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid rgba(255, 196, 25, 0.2);
            max-width: 500px;
        }

        .redirect-message strong {
            color: #ffc419;
        }
    </style>
</head>

<body onload="openBrowser()">
    <div class="redirect-container">
        <div class="redirect-logo">
            <img src="assets/img/logoBFT.svg" alt="BFTech Logo" />
        </div>

        <div class="redirect-content">
            <h1>Abriendo navegador</h1>
            <p>Te estamos redireccionando a tu destino...</p>
            <div class="loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="redirect-message">
            Si no se abre automáticamente en <strong>3 segundos</strong>, <strong>haz clic aquí</strong>.
        </div>
    </div>

    <script>
        function openBrowser() {
            var url = "https://bftech.es"; // tu web real

            // iPhone
            if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                window.location = "googlechrome://" + url.replace("https://", "");
            }
            // Android
            else if (navigator.userAgent.match(/Android/i)) {
                window.location = "intent://" + url.replace("https://", "") + "#Intent;scheme=https;package=com.android.chrome;end";
            }
            // fallback
            setTimeout(function () {
                window.location = url;
            }, 2000);
        }

        // Permitir clic en el mensaje para redirigir manualmente
        document.querySelector('.redirect-message').addEventListener('click', function () {
            window.location = "https://bftech.es";
        });

        // Hacer el cursor pointer en el mensaje
        document.querySelector('.redirect-message').style.cursor = 'pointer';
    </script>
</body>

</html>
